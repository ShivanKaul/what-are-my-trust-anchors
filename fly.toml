app = "what-are-my-trust-anchors-xopddw"
primary_region = "sjc"

[env]
  TLS_HOSTNAME = "what-are-my-trust-anchors-xopddw.fly.dev"
  AUTOCERT_CACHE = "/data/autocert"

# Persist the ACME cache to avoid unnecessary certificate reissuance and rate limits.
[mounts]
  source = "autocert_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
    handlers = []

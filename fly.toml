app = "what-are-my-trust-anchors"
primary_region = "sjc"

[env]
  TLS_HOSTNAME = "what-are-my-trust-anchors.fly.dev"
  AUTOCERT_CACHE = "/data/autocert"

# The ACME cache must outlive deploys, or every deploy triggers a fresh
# Let's Encrypt issuance and hits the 5-per-week-per-identifier limit.
[mounts]
  source = "autocert_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = []
